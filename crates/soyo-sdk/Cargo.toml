[package]
name = "soyo-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

description = "Stable socket-client SDK for the Soyo helper daemon (F-13, D-105)"

[dependencies]
soyo-ipc = { path = "../soyo-ipc" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["sync"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
