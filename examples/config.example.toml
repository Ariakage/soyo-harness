# Copy this file before editing. No credential values belong in this file.
schema_version = 1

[defaults]
profile = "local"
mode = "work"
permissions = "auto"
output = "text"

# Replace these values with the protocol, API root, model and actual context
# window of your own local service. config check does not contact the service.
[profiles.local]
protocol = "openai-chat-completions"
base_url = "http://127.0.0.1:8000/v1"
model = "YOUR_LOCAL_MODEL"
auth = "none"
context_window_tokens = 128000
stream = true
# Optional native model input. Enable only modalities accepted by this model.
# multimodal = { image = true, audio = false, video = false }
# Optional, only for models that support the requested effort level.
# thinking_effort = "max"
# Optional explicit request target. Omission uses limit.output, or 65536 when
# the model has no declared output default. Explicit values take precedence.
# max_output_tokens = 16000
# Optional model metadata. Replace this illustrative value for your model.
# [profiles.local.limit]
# output = 65536

# For an authenticated service, configure an additional profile and reference
# an environment variable NAME. Never put its value in this file:
# [profiles.remote]
# protocol = "openai-responses"
# base_url = "https://example.com/v1"
# model = "YOUR_MODEL"
# auth = "bearer"
# api_key_env = "SOYO_API_KEY"
# context_window_tokens = 128000
# Optional opt-in Anthropic prompt caching (system, tools, and history breakpoints):
# prompt_cache = true
# Optional full official Anthropic Messages mode (requires anthropic-messages + 2026-10-21;
# enables prompt caching, adaptive+summarized thinking, and bounded max_tokens text continuation):
# anthropic_official_provider = true

# N2 development defaults. Backend preparation happens when a run starts.
# config check validates policy syntax without launching native isolation.
[sandbox]
backend = "auto"
read_roots = []
write_roots = []
protected_paths = []
# Optional opt-in presets keep strict defaults untouched unless requested.
# ca_certs = true
# toolchain_presets = ["rust", "python", "node", "homebrew", "xcode_clt"]

[sandbox.network]
mode = "deny"

# Enable a server only after selecting its executable, permissions and roots.
# Toolchain files outside the workspace may require sandbox.read_roots.
[mcp.servers.local_example]
enabled = false
read_only_tools = []

[mcp.servers.local_example.transport]
type = "stdio"
argv = ["/absolute/path/to/mcp-server", "--stdio"]
# env = { SERVICE_TOKEN = "SOYO_MCP_TOKEN" }

[mcp.servers.remote_example]
enabled = false
read_only_tools = []

[mcp.servers.remote_example.transport]
type = "http"
endpoint = "https://mcp.example.invalid/mcp"
# bearer_env = "SOYO_MCP_TOKEN"
# credential_ref = "00000000-0000-0000-0000-000000000000"
# scopes = ["files:read"]

# N3 context uses the selected profile's window and output limit. It also
# reserves ceil(window / 10) + 1 safety tokens, plus the extra amount below.
[context]
auto_compact = true
trigger_percent = 80
target_percent = 55
extra_safety_tokens = 0
# Omission inherits the selected execution profile's output target.
# summary_max_output_tokens = 16000
max_compaction_calls = 32
compaction_timeout_seconds = 600

# The default host-selected root is ~/.soyo. A missing store stays absent until
# an approved write. read=false also suppresses automatic memory injection.
# Explicit --memory-file input remains independent from these switches.
[memory]
read = true
inject = true
write = true
# root = "/absolute/path/to/private-memory"

# Local installation and enablement require explicit plugin management commands.
[plugins]
enabled = true

# Browser and dedicated VM capabilities default to disabled. You can either set
# `enabled = true` below or toggle them cleanly with `soyo module browser enable`
# and `soyo module vm enable` (persisted in `$XDG_DATA_HOME/soyo/modules/modules.sqlite3`
# without modifying this file).
# [browser]
# enabled = false
# [browser.vm]
# enabled = false
# [browser.network]
# enabled = false

# Controlled parent-child subagents (`F-09`) default to disabled.
# When enabled, child subagents run at max_depth = 1 with non-escalating mode,
# permission, sandbox, secret, and shared budget bounds.
# [subagents]
# enabled = false
# max_concurrent = 4
# max_total = 16
# max_model_requests = 32
# max_tool_calls = 128
# default_timeout_seconds = 300
# max_timeout_seconds = 900
# max_workspace_files = 10000
# max_workspace_bytes = 67108864
# max_changed_files = 256
# max_patch_bytes = 262144
# max_summary_bytes = 32768

# Opt-in model routing, capability filtering, circuit-breaker failover,
# and explicit opaque-history migration (`F-16`).
# [profiles.primary.capabilities]
# tools = true
# reasoning = false
# task_types = ["code", "review"]
#
# [routing]
# enabled = false
# fallback_profiles = []
# prefer_lowest_cost = false
# max_run_cost_microunits = 1000000
# cost_currency = "USD"
# require_pricing_for_budget = false
# circuit_breaker_failures = 2
# cooldown_seconds = 60
# opaque_history = "reject"
#
# [routing.roles]
# execution = []
# planning = []
# review = []
# compaction = []
# plan = []
# build = []
# code = []
# work = []

# Opt-in external SQLite project index and sandboxed LSP code intelligence (`F-17`).
# [code_intel]
# enabled = false
# inject_context = true
# max_context_bytes = 8192
# max_files = 10000
# max_file_bytes = 1048576
# max_total_index_bytes = 67108864
# max_symbols_per_file = 512
# max_query_results = 50
#
# [code_intel.lsp]
# enabled = false
# request_timeout_seconds = 15
# startup_timeout_seconds = 30
# max_diagnostics_per_file = 100
# max_open_documents = 64
# max_edit_files = 32
# read_roots = []
#
# [code_intel.lsp.servers.rust]
# enabled = true
# argv = ["rust-analyzer"]
# languages = ["rust"]
# extensions = ["rs"]
# root_markers = ["Cargo.toml"]


